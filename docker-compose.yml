services:
  sentinel:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["sentinel-data:/app/var"]
    restart: unless-stopped
  # Optional local LLM. Start with:  docker compose --profile llm up
  # then: docker compose exec ollama ollama pull qwen2.5-coder:7b  and set OLLAMA_URL=http://ollama:11434 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  sentinel-data:
  ollama:
